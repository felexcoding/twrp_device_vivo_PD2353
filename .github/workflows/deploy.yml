name: Build TWRP for Vivo PD2353

on:
  workflow_dispatch: # Запуск вручную через вкладку Actions

jobs:
  build:
    runs-on: ubuntu-20.04 # Используем 20.04 для лучшей совместимости со старыми тулзами Android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup and Maximize Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libc6-dev libncurses5-dev libssl-dev x11proto-core-dev libx11-dev libgl1-mesa-dev g++-multilib tox gcc-multilib libxml2-utils xsltproc zlib1g-dev python3 python3-pip git rsync

      - name: Config Git
        run: |
          git config --global user.name "qcopy"
          git config --global user.email "qcopy@example.com"
          git config --global --add safe.directory "*"

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          # Используем curl -L для следования редиректам, чтобы не скачать XML ошибку
          curl -L https://storage.googleapis.com > ~/bin/repo
          chmod a+x ~/bin/repo
          # Проверка: если в первой строке нет 'python', значит скачалась ошибка
          head -n 1 ~/bin/repo | grep python || (echo "Repo download failed!" && exit 1)

      - name: Initialize TWRP Manifest
        run: |
          export PATH=~/bin:$PATH
          mkdir twrp
          cd twrp
          # Манифест для Android 12.1 (под ядро 5.10)
          repo init --depth=1 -u https://github.com -b twrp-12.1
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Tree
        run: |
          cd twrp
          # Клонируем содержимое текущего репозитория в папку устройства
          git clone ${{ github.server_url }}/${{ github.repository }} device/vivo/PD2353

      - name: Build TWRP
        run: |
          export PATH=~/bin:$PATH
          cd twrp
          source build/envsetup.sh
          # Твой таргет из vendorsetup.sh
          lunch twrp_PD2353-eng || lunch omni_PD2353-eng
          # Собираем образ. Для A/B это создаст boot.img
          mka recoveryimage -j$(nproc --all)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Vivo-PD2353
          path: |
            twrp/out/target/product/PD2353/recovery.img
            twrp/out/target/product/PD2353/boot.img
            twrp/out/target/product/PD2353/*.zip
