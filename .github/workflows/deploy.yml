name: Build TWRP for Vivo PD2353

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 180

    # По умолчанию все run-шага выполняем в ~/twrp
    defaults:
      run:
        shell: bash
        working-directory: /home/runner/twrp   # поменяй на свой $HOME, если другой

    steps:
      - name: Checkout device-tree repo
        uses: actions/checkout@v4
        with:
          path: device_repo   # репо прилетит в /home/runner/twrp/device_repo

      - name: Install dependencies
        run: |
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S apt-get update || true
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S apt-get install -y \
            bc build-essential zip curl libc6-dev libncurses5-dev libssl-dev \
            x11proto-core-dev libx11-dev libgl1-mesa-dev g++-multilib tox \
            gcc-multilib libxml2-utils xsltproc zlib1g-dev python3 python3-pip \
            git rsync python-is-python3 || true

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Init or update TWRP sources
        run: |
          export PATH=~/bin:$PATH
          export PYTHONUNBUFFERED=1
          export GIT_TERMINAL_PROMPT=0

          mkdir -p sources
          cd sources

          if [ ! -d .repo ]; then
            echo "First run: repo init + full sync"
            python3 ~/bin/repo init --depth=1 --no-repo-verify \
              -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp \
              -b twrp-12.1
            python3 ~/bin/repo sync -c -j4 --force-sync --no-clone-bundle \
              --no-tags --optimized-fetch --prune
          else
            echo "Existing tree: fast partial sync"
            python3 ~/bin/repo sync -c -j4 --fail-fast
          fi

          rm -rf prebuilts/rust

      - name: Copy device tree into sources
        run: |
          cd sources
          rm -rf device/vivo/PD2353
          mkdir -p device/vivo
          cp -a ../device_repo/device/vivo/PD2353 device/vivo/PD2353

      - name: Debug device files
        run: |
          cd sources
          echo "=== PREBUILT ==="
          ls -la device/vivo/PD2353/prebuilt/ || echo "no prebuilt dir"
          echo "=== DTB PATH IN BoardConfig ==="
          grep TARGET_PREBUILT_DTB device/vivo/PD2353/BoardConfig.mk || echo "no TARGET_PREBUILT_DTB"

      - name: Build TWRP
        run: |
          export PATH=~/bin:$PATH
          cd sources
          export ALLOW_MISSING_DEPENDENCIES=true

          if [ ! -f build/envsetup.sh ]; then
            echo "build/envsetup.sh not found – repo sync probably failed"
            ls
            exit 1
          fi

          source build/envsetup.sh
          lunch omni_PD2353-eng || (echo "Lunch failed!" && exit 1)
          mka recoveryimage -j"$(nproc --all)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Vivo-PD2353
          path: |
            /home/runner/twrp/sources/out/target/product/PD2353/recovery.img
            /home/runner/twrp/sources/out/target/product/PD2353/boot.img
            /home/runner/twrp/sources/out/target/product/PD2353/*.zip
