name: Build TWRP for Vivo PD2353

on:
  workflow_dispatch: # Запуск вручную кнопкой в Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libc6-dev libncurses5-dev libssl-dev x11proto-core-dev libx11-dev libgl1-mesa-dev g++-multilib tox gcc-multilib libxml2-utils xsltproc zlib1g-dev python3 python3-pip git

      - name: Install Repo
        run: |
          mkdir ~/bin
          curl https://storage.googleapis.com > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH

      - name: Initialize TWRP Manifest
        run: |
          export PATH=~/bin:$PATH
          mkdir twrp
          cd twrp
          repo init --depth=1 -u https://github.com -b twrp-12.1
          repo sync -j$(nproc --all)

      - name: Clone Device Tree
        run: |
          cd twrp
          # Твоё дерево устройства клонируется в правильный путь
          git clone ${{ github.server_url }}/${{ github.repository }} device/vivo/PD2353

      - name: Build Recovery
        run: |
          export PATH=~/bin:$PATH
          cd twrp
          source build/envsetup.sh
          # Выбираем твое устройство
          lunch twrp_PD2353-eng
          # Собираем образ (для A/B устройств это создаст boot.img с ramdisk TWRP)
          mka recoveryimage -j$(nproc --all)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Vivo-PD2353
          path: |
            twrp/out/target/product/PD2353/recovery.img
            twrp/out/target/product/PD2353/boot.img
