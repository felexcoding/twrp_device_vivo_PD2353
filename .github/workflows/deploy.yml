name: Build TWRP for Vivo PD2353

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 180
    steps:
      - name: Checkout device tree repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S apt-get update || true
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S apt-get install -y bc build-essential zip curl libc6-dev libncurses5-dev libssl-dev x11proto-core-dev libx11-dev libgl1-mesa-dev g++-multilib tox gcc-multilib libxml2-utils xsltproc zlib1g-dev python3 python3-pip git rsync python-is-python3 schedtool lzop bison flex gperf lib32ncurses5-dev lib32z1-dev lib32stdc++6 || true

      - name: Config git
        run: |
          git config --global user.name "qcopy"
          git config --global user.email "qcopy@example.com"
          git config --global --add safe.directory "*"
          git config --global credential.helper store
          git config --global http.postBuffer 524288000

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo || true
          chmod a+x ~/bin/repo || true

      - name: Init or update TWRP sources
        run: |
          export PATH=~/bin:$PATH
          export PYTHONUNBUFFERED=1
          export GIT_TERMINAL_PROMPT=0
          
          mkdir -p ~/twrp/sources
          cd ~/twrp/sources

          if [ ! -d .repo ]; then
            echo "First run: repo init + full sync"
            python3 ~/bin/repo init --depth=1 --no-repo-verify \
              -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp \
              -b twrp-12.1
            python3 ~/bin/repo sync -c -j4 --force-sync --no-clone-bundle \
              --no-tags --optimized-fetch --prune
          else
            echo "Existing tree: fast partial sync"
            python3 ~/bin/repo sync -c -j4 --fail-fast || true
          fi

          rm -rf prebuilts/rust || true

      - name: Copy device tree into sources
        run: |
          rm -rf ~/twrp/sources/device/vivo/PD2353
          mkdir -p ~/twrp/sources/device/vivo
          cp -a $GITHUB_WORKSPACE/device/vivo/PD2353 ~/twrp/sources/device/vivo/PD2353 || true
          ls -la ~/twrp/sources/device/vivo/PD2353/ || echo "Device tree copy failed"

      - name: Debug device files
        run: |
          cd ~/twrp/sources
          echo "=== PREBUILT ==="
          ls -la device/vivo/PD2353/prebuilt/ 2>/dev/null || echo "no prebuilt dir"
          echo "=== DTB PATH ==="
          grep TARGET_PREBUILT_DTB device/vivo/PD2353/BoardConfig.mk 2>/dev/null || echo "no TARGET_PREBUILT_DTB"

      - name: Build TWRP
        shell: bash
        run: |
          set -e
          export PATH=~/bin:$PATH
          cd ~/twrp/sources
          export ALLOW_MISSING_DEPENDENCIES=true

          if [ ! -f build/envsetup.sh ]; then
            echo "ERROR: build/envsetup.sh not found"
            ls -la
            exit 1
          fi

          source build/envsetup.sh
          lunch omni_PD2353-eng || (echo "Lunch failed!" && exit 1)
          mka recoveryimage -j"$(nproc --all)"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Vivo-PD2353
          path: |
            ~/twrp/sources/out/target/product/PD2353/recovery.img
            ~/twrp/sources/out/target/product/PD2353/boot.img
            ~/twrp/sources/out/target/product/PD2353/*.zip
